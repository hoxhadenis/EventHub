<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">
    
    <div class="mb-8 border-b border-gray-200 pb-4 flex justify-between items-center">
      <h2 class="text-2xl font-bold text-gray-900">Pubblica un Nuovo Evento</h2>
      <a routerLink="/organizer/dashboard" class="text-sm text-indigo-600 hover:text-indigo-800">Torna alla Dashboard</a>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
      <p class="text-sm text-red-700">{{ errorMessage }}</p>
    </div>

    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-gray-700">Titolo Evento *</label>
          <input type="text" formControlName="title" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Città *</label>
          <input type="text" formControlName="city" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Luogo (Indirizzo/Locale) *</label>
          <input type="text" formControlName="location" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Data e Ora *</label>
          <input type="datetime-local" formControlName="date" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Categoria *</label>
          <select formControlName="category" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md bg-white">
            <option value="Musica">Musica</option>
            <option value="Workshop">Workshop</option>
            <option value="Cultura">Cultura</option>
            <option value="Tecnologia">Tecnologia</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Posti Disponibili *</label>
          <input type="number" formControlName="available_seats" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Prezzo (€)</label>
          <input type="number" step="0.01" formControlName="price" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Descrizione dell'evento *</label>
        <textarea formControlName="description" rows="4" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500"></textarea>
      </div>

      <div class="border-2 border-dashed border-gray-300 rounded-md p-6 text-center">
        <label class="block text-sm font-medium text-gray-700 mb-2">Immagine di Copertina (Obbligatoria) *</label>
        <input type="file" accept="image/*" (change)="onFileSelected($event)" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
      </div>

      <div class="pt-4 border-t border-gray-200 flex justify-end">
        <button type="submit" [disabled]="isLoading" class="bg-indigo-600 text-white px-6 py-2 rounded-md font-medium hover:bg-indigo-700 disabled:opacity-50">
          <span *ngIf="isLoading">Pubblicazione in corso...</span>
          <span *ngIf="!isLoading">Pubblica Evento</span>
        </button>
      </div>
      
    </form>
  </div>
</div>
