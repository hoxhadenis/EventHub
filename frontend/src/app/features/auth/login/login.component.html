<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
    
    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900">
        Bentornato su <span class="text-indigo-600">EventHub</span>
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Accedi al tuo account per gestire i tuoi eventi
      </p>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 mb-4">
      <div class="flex">
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ errorMessage }}</p>
        </div>
      </div>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="space-y-4">
        
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Indirizzo Email</label>
          <div class="mt-1">
            <input id="email" type="email" formControlName="email" class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="tu@email.com">
          </div>
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-red-500 text-xs mt-1">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">L'email è obbligatoria.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Inserisci un formato email valido.</span>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <div class="mt-1">
            <input id="password" type="password" formControlName="password" class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="••••••••">
          </div>
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-red-500 text-xs mt-1">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">La password è obbligatoria.</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">La password deve essere di almeno 6 caratteri.</span>
          </div>
        </div>
        
      </div>

      <div>
        <button type="submit" [disabled]="isLoading" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 transition">
          <span *ngIf="isLoading">Accesso in corso...</span>
          <span *ngIf="!isLoading">Accedi</span>
        </button>
      </div>
      
    </form>
  </div>
</div>
